<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look and feel - Pages (Section) mock</title>
<style>
  :root{
    --primary:#126dfe; --text:#031026e0; --muted:#031026b2; --disabled:#03102675;
    --stroke:#0310262b; --divider:#0310261a; --hover:#0310260d; --surface:#fff;
    --canvas:#f3f3f4; --radius:6px; --radius-lg:8px;
    font-family:"Inter Variable",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);font-size:14px;line-height:20px}
  header{height:80px;border-bottom:1px solid var(--divider);display:flex;align-items:center;padding:0 24px;gap:24px}
  header .logo{color:var(--primary);font-weight:700;font-size:22px}
  header .search{margin:0 auto;width:450px;height:44px;border:1px solid var(--stroke);border-radius:var(--radius);display:flex;align-items:center;padding:0 16px;color:var(--disabled)}
  .layout{display:flex;min-height:calc(100vh - 80px)}
  nav{width:272px;padding:12px 16px;flex:none}
  nav a{display:flex;align-items:center;height:40px;margin-bottom:2px;padding:0 16px;border-radius:var(--radius);color:var(--text);text-decoration:none}
  nav a.sub{padding-left:32px} nav a.sub2{padding-left:48px}
  nav a.active{background:var(--hover)}
  nav hr{border:0;border-top:1px solid var(--divider);margin:8px 0}
  main{flex:1;min-width:0}
  .page-h{padding:20px 24px 0 24px;height:88px}
  .page-h b{font-weight:500;font-size:16px;display:block}
  .page-h span{color:var(--muted)}
  .props{display:flex;gap:32px;padding:0 24px 40px;align-items:flex-start}
  .controls{width:438px;flex:none;margin-left:10px}
  .visuals{flex:1;min-width:0;max-width:469px;position:sticky;top:16px}
  .group-title{font-size:16px;font-weight:400;margin:16px 0 12px}
  .group-title.sec{font-weight:600;font-size:16px}
  .row{display:flex;align-items:center;gap:12px;min-height:56px}
  .row .label{flex:1;font-size:16px}
  .divider{border-top:1px solid var(--divider);margin:12px 0}
  .head{display:flex;justify-content:space-between;align-items:center;height:40px;font-size:16px}
  .sub-label{color:var(--muted);font-size:14px;margin-top:-4px;margin-bottom:8px}
  .swatch{width:44px;height:44px;border-radius:50%;border:1px solid var(--stroke);position:relative;overflow:hidden;flex:none;cursor:pointer;
    background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);background-size:10px 10px;background-position:0 0,5px 5px}
  .swatch i{position:absolute;inset:0;display:block}
  .swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .select{flex:1;display:flex;justify-content:space-between;align-items:center;height:40px;font-size:16px}
  .select button{border:0;background:none;font:inherit;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:var(--radius)}
  .select button:hover{background:var(--hover)}
  .inputs{display:grid;grid-template-columns:207px 207px;gap:24px;align-items:center;margin-bottom:12px}
  .input{display:flex;align-items:center;height:40px;border:1px solid var(--stroke);border-radius:var(--radius);padding:0 12px;gap:8px;background:#fff}
  .input:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px #126dfe33}
  .input .pre{color:var(--muted);flex:none;display:flex}
  .input input{border:0;outline:0;flex:1;min-width:0;font:inherit;font-size:16px;color:var(--text);background:transparent}
  .input .unit{color:var(--muted);font-size:16px}
  .tabs{display:flex;height:40px}
  .tabs button{flex:1;border:0;background:transparent;font:inherit;font-size:16px;color:var(--text);border-radius:var(--radius);cursor:pointer}
  .tabs button:hover{background:var(--hover)}
  .tabs button.on{background:var(--hover)}
  .unit-btn{display:flex;align-items:center;gap:4px;height:40px;padding:0 12px;border:0;background:none;font:inherit;font-size:16px;cursor:pointer;border-radius:var(--radius);width:fit-content}
  .unit-btn:hover{background:var(--hover)}
  .pct{width:113px;margin-left:auto}
  .pct.dis{background:var(--hover);border-color:var(--divider)}
  .stage{background:var(--canvas);border-radius:16px;padding:32px;display:flex;justify-content:center}
  .stage-inner{background:#fff;border-radius:var(--radius-lg);padding:16px;width:100%;display:flex;justify-content:center;overflow:hidden}
  .scaler{position:relative}
  .section{position:absolute;top:0;left:0;transform-origin:top left;display:flex;overflow:hidden;border-radius:4px;outline:1px dashed #12122a22}
  .section .overlay{position:absolute;inset:0;pointer-events:none}
  .section .cols{position:relative;display:flex;width:100%;height:100%}
  .card{flex:1;background:#f3f3f4;border-radius:12px;min-height:0}
  .readout{margin-top:12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .reset{margin-top:12px;border:1px solid var(--stroke);background:#fff;height:40px;padding:0 16px;border-radius:var(--radius);font:inherit;font-size:14px;cursor:pointer}
  .reset:hover{background:var(--hover)}
  svg{display:block}
  @media(max-width:1000px){.props{flex-direction:column}.visuals{position:static;width:100%}}
</style>
</head>
<body>
<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#031026" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  <span class="logo">bynder</span>
  <div class="search">Search</div>
</header>
<div class="layout">
  <nav>
    <a>‹&nbsp;&nbsp;Back</a>
    <hr>
    <a>Colors</a><a>Typography</a><a>▾&nbsp;&nbsp;Look and feel</a>
    <a class="sub">Guides</a><a class="sub active">Pages</a><a class="sub2">▸&nbsp;&nbsp;Widgets</a>
    <a class="sub">Global buttons</a><a>Properties</a>
  </nav>
  <main>
    <div class="page-h"><b>Look and feel - Pages</b><span>Bynder Theme</span></div>
    <div class="props">
      <div class="controls">
        <div class="group-title sec">Section</div>

        <div class="head">Background <span>⌃</span></div>
        <div class="row">
          <label class="swatch"><i id="bgSw"></i><input type="color" id="bg" value="#ffffff"></label>
          <div class="select"><span>Background color</span><button id="bgClear" title="Clear">✕</button></div>
        </div>
        <div class="row">
          <label class="swatch"><i id="ovSw"></i><input type="color" id="ov" value="#031026"></label>
          <div class="select"><span>Overlay</span></div>
          <div class="input pct dis" id="ovBox"><input id="ovPct" type="number" min="0" max="100" placeholder="" disabled><span class="unit">%</span></div>
        </div>
        <div class="divider"></div>

        <div class="head">Size <span>⌃</span></div>
        <div class="inputs">
          <div class="input"><span class="pre">W</span><input id="w" type="number" value="800" min="200" max="1600"><span class="unit">px</span></div>
          <div class="tabs" data-for="w" data-map="800,1000,1200"><button class="on">S</button><button>M</button><button>L</button></div>
        </div>
        <div class="inputs" style="margin-top:-4px">
          <div class="input"><span class="pre">H</span><input id="h" type="number" value="150" min="50" max="800"></div>
          <button class="unit-btn" id="hUnit">px ▾</button>
        </div>
        <div class="divider"></div>

        <div class="head">Padding <span>⌃</span></div>
        <div class="inputs">
          <div class="input"><span class="pre"><svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 1v14M18 1v14"/><rect x="6" y="4.5" width="8" height="7" rx="1"/></svg></span><input id="px" type="number" value="0" min="0" max="200"><span class="unit">px</span></div>
          <div class="tabs" data-for="px" data-map="8,16,32"><button>S</button><button>M</button><button>L</button></div>
        </div>
        <div class="inputs" style="margin-top:-4px">
          <div class="input"><span class="pre"><svg width="20" height="16" viewBox="0 0 20 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 2h18M1 14h18"/><rect x="5.5" y="5" width="9" height="6" rx="1"/></svg></span><input id="py" type="number" value="16" min="0" max="200"><span class="unit">px</span></div>
          <div class="tabs" data-for="py" data-map="8,16,32"><button>S</button><button class="on">M</button><button>L</button></div>
        </div>
        <div class="divider"></div>

        <div class="head" style="height:auto;align-items:flex-start"><div>Section settings<div class="sub-label" style="margin:0">Applies to all widgets</div></div><span>⌃</span></div>
        <div style="font-size:16px;margin:12px 0 8px">Alignment</div>
        <div class="tabs" id="align">
          <button data-v="flex-start" title="Top"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="margin:auto"><path d="M3 3h14M10 17V7M6.5 10.5L10 7l3.5 3.5"/></svg></button>
          <button data-v="center" class="on" title="Middle"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="margin:auto"><path d="M3 10h14M10 2v5M7.5 5L10 7.5 12.5 5M10 18v-5M7.5 15L10 12.5 12.5 15"/></svg></button>
          <button data-v="flex-end" title="Bottom"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="margin:auto"><path d="M3 17h14M10 3v10M6.5 9.5L10 13l3.5-3.5"/></svg></button>
        </div>
        <div class="divider"></div>

        <div style="font-size:16px;margin:12px 0 8px">Spacing</div>
        <div class="inputs">
          <div class="input"><input id="sp" type="number" value="16" min="0" max="120"><span class="unit">px</span></div>
          <div class="tabs" data-for="sp" data-map="8,16,32"><button>S</button><button class="on">M</button><button>L</button></div>
        </div>
        <button class="reset" id="reset">Reset to defaults</button>
      </div>

      <div class="visuals">
        <div class="stage"><div class="stage-inner" id="inner"><div class="scaler" id="scaler">
          <div class="section" id="sec"><div class="overlay" id="ovl"></div><div class="cols" id="cols"><div class="card"></div><div class="card"></div></div></div>
        </div></div></div>
        <div class="readout" id="readout"></div>
      </div>
    </div>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
const defaults={bg:'#ffffff',bgOn:false,ov:'#031026',ovPct:'',w:800,h:150,px:0,py:16,sp:16,align:'center'};
let s={...defaults};
const CARD_H=110; // unscaled content height of each card, so alignment is visible when H > content

function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

function render(){
  const sec=$('sec'),inner=$('inner'),scaler=$('scaler');
  const avail=inner.clientWidth-32;                // stage-inner minus its padding
  const scale=Math.min(avail/Math.max(s.w,1),0.5);
  sec.style.width=s.w+'px'; sec.style.height=s.h+'px';
  sec.style.padding=`${s.py}px ${s.px}px`;
  sec.style.background=s.bgOn?s.bg:'transparent';
  sec.style.transform=`scale(${scale})`;
  scaler.style.width=s.w*scale+'px'; scaler.style.height=s.h*scale+'px';
  const cols=$('cols'); cols.style.gap=s.sp+'px'; cols.style.alignItems=s.align;
  cols.querySelectorAll('.card').forEach(c=>{c.style.flex='1';c.style.height=Math.min(CARD_H,Math.max(s.h-2*s.py,0))+'px'});
  const p=parseFloat(s.ovPct);
  $('ovl').style.background=(!isNaN(p)&&p>0)?hexA(s.ov,Math.min(p,100)/100):'transparent';
  $('bgSw').style.background=s.bgOn?s.bg:'transparent';
  $('ovSw').style.background=(!isNaN(p)&&p>0)?s.ov:'transparent';
  $('ovPct').disabled=false;
  $('ovBox').classList.remove('dis');
  $('readout').textContent=`${s.w} × ${s.h}px · padding ${s.px}/${s.py}px · spacing ${s.sp}px · preview ${Math.round(scale*100)}%`;
  // tab highlight sync
  document.querySelectorAll('.tabs[data-for]').forEach(t=>{
    const map=t.dataset.map.split(',').map(Number),v=s[t.dataset.for];
    [...t.children].forEach((b,i)=>b.classList.toggle('on',map[i]===v));
  });
  document.querySelectorAll('#align button').forEach(b=>b.classList.toggle('on',b.dataset.v===s.align));
}
function sync(){['w','h','px','py','sp'].forEach(k=>$(k).value=s[k]);$('ovPct').value=s.ovPct;$('bg').value=s.bg;$('ov').value=s.ov}

['w','h','px','py','sp'].forEach(k=>$(k).addEventListener('input',e=>{const v=parseFloat(e.target.value);s[k]=isNaN(v)?0:v;render()}));
document.querySelectorAll('.tabs[data-for]').forEach(t=>{
  const map=t.dataset.map.split(',').map(Number);
  [...t.children].forEach((b,i)=>b.addEventListener('click',()=>{s[t.dataset.for]=map[i];sync();render()}));
});
document.querySelectorAll('#align button').forEach(b=>b.addEventListener('click',()=>{s.align=b.dataset.v;render()}));
$('bg').addEventListener('input',e=>{s.bg=e.target.value;s.bgOn=true;render()});
$('bgClear').addEventListener('click',()=>{s.bgOn=false;render()});
$('ov').addEventListener('input',e=>{s.ov=e.target.value;if(s.ovPct==='')s.ovPct=40;sync();render()});
$('ovPct').addEventListener('input',e=>{s.ovPct=e.target.value;render()});
$('reset').addEventListener('click',()=>{s={...defaults};sync();render()});
window.addEventListener('resize',render);
sync();render();
</script>
</body>
</html>
