<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Face Recognition management: dev prototype v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TOKENS: read live from the Bynder Components and Foundation libraries
   (Figma file mZn5IebNwl8LF7sSWPPUp2, re-pulled 2 Oct 2026).
   Do not hand edit. Re-read with get_variable_defs if the DS moves.

:root{
  --surface:#ffffff; --card-frame:#f8f8f9; --card-stroke:#0310262b; --card-stroke-hover:#03102647;
  --divider:#0310261a;
  --text:#212c40; --muted:#4f5867; --disabled:#8b919b; --inverse-muted:#ffffff99;
  --primary:#126dfe; --sec-fill:#03102608; --sec-stroke:#0310261a; --sec-on:#031026e0;
  --danger:#d54035; --danger-hover:#9e3028; --danger-disabled:#eeaba6;
  --chip:#0310260d; --chip-cur:#ecf3ff; --input-stroke:#0310262b; --control:#0310261a;
  --success:#35a284; --warn-surface:#fff2d9;
  --r:6px; --r-l:8px; --r-xl:12px; --pill:9999px;
  --e1:0 1px 4px -1px #0310261a,0 0 1px 0 #0310261a;
  --e2:0 2px 4px -1px #0310261a,0 0 1px 0 #0310261a;
  --e4:0 8px 12px -2px #0310261a,0 0 1px 0 #0310261a;
  --font:"Inter Variable","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e9ecf0}
body{font:14px/20px var(--font);color:var(--text);display:flex}
button{font:inherit;color:inherit;cursor:pointer;padding:0;border:0;background:none;text-align:inherit}
input,select{font:inherit;color:inherit}
.ic{display:block;flex:0 0 auto}

/* ============================ DEV PANEL ============================ */
#dev{width:320px;flex:0 0 320px;height:100vh;overflow:auto;background:#fff;border-right:1px solid var(--divider);transition:margin-left .2s}
body.devclosed #dev{margin-left:-320px}
#dev .dh{padding:16px}
#dev .dh b{font-size:15px;display:block}
#dev .dh small{color:var(--muted)}
#dev section{border-top:1px solid var(--divider);padding:12px 16px}
#dev h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
#dev select{width:100%;height:36px;border:1px solid var(--input-stroke);border-radius:var(--r);padding:0 8px;background:#fff}
#dev .hint{color:var(--muted);font-size:12px;line-height:16px;margin:8px 0 0}
#dev .grp{margin:8px 0 2px;font-size:12px;font-weight:600;color:var(--muted)}
.scen{display:flex;gap:8px;align-items:flex-start;width:calc(100% + 16px);margin:0 -8px;padding:6px 8px;border-radius:var(--r)}
.scen:hover{background:var(--sec-fill)}
.scen.cur{background:var(--chip-cur);box-shadow:inset 3px 0 0 var(--primary)}
.scen .l{flex:1}
.pill{font-size:11px;line-height:16px;padding:0 6px;border-radius:var(--pill);white-space:nowrap;margin-top:2px}
.pill.ready{background:#e7f4f0;color:#1d5f4d}.pill.open{background:#fdf1e3;color:#8a5200}
.pill.blocked{background:#fdeceb;color:#8f2b23}.pill.unscoped{background:#e9ecf0;color:#4f5867}
.pill.proposed{background:#e8f0fe;color:#0b4aa2}
.tgl{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}
.tgl input{accent-color:var(--primary);width:16px;height:16px}
#dev .note h3{margin:0 0 6px;font-size:14px}
#dev .note code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0310260d;padding:1px 4px;border-radius:3px;word-break:break-word}
#dev .note ul{margin:6px 0 0;padding-left:18px}#dev .note li{margin-bottom:4px}
#dev .note .q{color:var(--danger);margin-top:8px;font-weight:600;font-size:12px}
#dev .resetbtn{width:100%;height:36px;border:1px solid var(--sec-stroke);background:var(--sec-fill);border-radius:var(--r)}
#devtoggle{position:absolute;left:12px;top:12px;z-index:5;width:32px;height:32px;border-radius:var(--r);background:#fff;box-shadow:var(--e1);display:grid;place-items:center}

/* ============================ STAGE ============================ */
#stagewrap{flex:1;position:relative;overflow:hidden}
#app{position:absolute;left:50%;top:50%;width:1280px;height:832px;margin:-416px 0 0 -640px;background:var(--surface);
  border-radius:var(--r-xl);box-shadow:var(--e4);overflow:hidden;transform-origin:center center}
#dslabel{position:fixed;z-index:9999;pointer-events:none;background:#d54035;color:#fff;font-size:11px;line-height:16px;padding:0 6px;border-radius:3px;display:none;white-space:nowrap}
body.dsl [data-ds]{outline:1px dashed #d54035;outline-offset:-1px}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#031026;color:#fff;font-size:12px;line-height:16px;padding:4px 8px;border-radius:var(--r);white-space:nowrap;z-index:400;pointer-events:none}

/* ============================ PRIMITIVES (DS) ============================ */
.iconbtn{width:40px;height:40px;border-radius:var(--r);display:grid;place-items:center;color:var(--text);flex:0 0 40px}
.iconbtn:hover{background:var(--sec-fill)}
.iconbtn[disabled]{color:var(--disabled);cursor:default}.iconbtn[disabled]:hover{background:none}
.btn{height:40px;padding:0 12px;border-radius:var(--r);border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.btn.pri{background:var(--primary);color:#fff}.btn.pri:hover{filter:brightness(.93)}
.btn.sec{background:var(--sec-fill);border-color:var(--sec-stroke);color:var(--sec-on)}.btn.sec:hover{background:#0310260f}
.btn.clean:hover{background:var(--sec-fill)}
.btn.dng{background:var(--danger);color:#fff}.btn.dng:hover{background:var(--danger-hover)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.dng[disabled]{background:var(--danger-disabled);opacity:1}
.btn.clean[disabled]:hover,.btn.sec[disabled]:hover{background:inherit}
.chip{height:32px;padding:0 12px;border-radius:var(--pill);background:var(--chip);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.cur{background:var(--chip-cur);color:var(--primary)}
.chip:not(.cur):hover{background:#03102614}
.spin{width:14px;height:14px;border:2px solid #0310262b;border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.badge{height:24px;padding:0 8px;border-radius:var(--r);background:var(--chip);font-size:12px;line-height:24px;color:var(--muted);white-space:nowrap}
.tag{font-size:11px;line-height:16px;padding:0 6px;border-radius:var(--r);background:var(--chip-cur);color:var(--primary)}
.switch{width:44px;height:24px;border-radius:var(--pill);background:var(--control);position:relative;flex:0 0 44px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--e1);transition:left .15s}
.switch[aria-pressed="true"]{background:var(--primary)}.switch[aria-pressed="true"]::after{left:23px}
.inp{position:relative;display:flex;align-items:center;gap:8px;height:40px;border:1px solid var(--input-stroke);border-radius:var(--r);padding:0 10px 0 12px;background:#fff}
.inp:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px var(--chip-cur)}
.inp.err{border-color:var(--danger)}.inp.err:focus-within{box-shadow:0 0 0 2px #fbe3e1}
.inp input{border:0;outline:0;flex:1;min-width:0;background:none}
.inp input::placeholder{color:var(--disabled)}
.inp .clr{color:var(--disabled);display:grid;place-items:center}
.helper{font-size:12px;line-height:16px;color:var(--muted);margin-top:4px}.helper.err{color:var(--danger)}
.cb{width:18px;height:18px;border-radius:4px;border:1.5px solid #0310264d;display:grid;place-items:center;color:#fff;background:#fff}
.cb.on{background:var(--primary);border-color:var(--primary)}
.menu{position:absolute;z-index:60;background:#fff;box-shadow:var(--e4);border-radius:var(--r);padding:8px 0;min-width:236px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:8px 16px;height:40px}
.menu button:hover{background:var(--sec-fill)}
.menu button[disabled]{color:var(--disabled);cursor:default}.menu button[disabled]:hover{background:none}
.menu .sep{height:1px;background:var(--divider);margin:8px 0}
.menu .dng{color:var(--danger)}
.menu.up{top:auto!important;bottom:calc(100% - 36px)}
.hatch{width:20px;height:20px;border-radius:4px;background:repeating-linear-gradient(135deg,#0310264d 0 2px,transparent 2px 5px)}
.pnote{border:1px dashed #b8860b;background:#fffaf0;color:#6b4a00;border-radius:var(--r);padding:6px 10px;font-size:12px;line-height:16px}

/* ============================ BYNDER SHELL ============================ */
.shell{display:flex;flex-direction:column;height:100%}
.btop{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:center;position:relative}
.bsearch{width:540px;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--input-stroke);border-radius:var(--r);color:var(--disabled)}
.bsearch span{flex:1}
.bright{position:absolute;right:24px;top:8px;display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:#0310260d;display:grid;place-items:center;font-weight:500}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;background:var(--primary);border-radius:50%}
.bnav{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:0 24px;gap:8px;border-bottom:1px solid var(--divider);box-shadow:0 1px 3px #0310260d}
.logo{display:flex;align-items:center;gap:6px;color:var(--primary);font-size:22px;font-weight:600;letter-spacing:-.5px;margin-right:16px}
.bnav .ni{height:36px;padding:0 12px;border-radius:var(--r);display:flex;align-items:center;gap:4px}
.bnav .ni:hover{background:var(--sec-fill)}.bnav .ni.cur{background:#0310260f}
.bnav .sp{flex:1}
.bfilters{height:48px;flex:0 0 48px;display:flex;align-items:center;gap:20px;padding:0 24px;color:var(--text)}
.bfilters .fi{display:flex;align-items:center;gap:4px}
.btool{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 24px}
.rbadge{background:var(--primary);color:#fff;border-radius:var(--r);height:24px;min-width:32px;padding:0 6px;display:grid;place-items:center;font-size:12px}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:0 120px 24px;overflow:hidden}
.acard{border:1px solid var(--card-stroke);border-radius:var(--r);overflow:hidden;background:#fff}
.acard .im{height:150px;position:relative;background:var(--card-frame)}
.acard .im img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.acard .jpg{position:absolute;right:8px;bottom:8px;background:#031026cc;color:#fff;font-size:11px;padding:0 6px;border-radius:4px;line-height:18px}
.acard .tx{padding:10px 12px}.acard .tx small{display:block;color:var(--muted);font-size:12px}
.pulse::before{content:"";position:absolute;inset:-4px;border:2px solid var(--primary);border-radius:var(--r);animation:pl 1.4s ease-out infinite;pointer-events:none}
@keyframes pl{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
.fpill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px 0 12px;border-radius:var(--pill);background:var(--chip-cur);color:var(--primary)}

/* ============================ CONTROL CENTER ============================ */
.ccwrap{flex:1;display:flex;min-height:0}
.ccnav{width:300px;border-right:1px solid var(--divider);padding:16px 12px}
.ccnav h3{margin:0 8px 12px;font-size:14px;font-weight:600}
.ccnav .ci{display:block;width:100%;padding:8px 12px;border-radius:var(--r);color:var(--muted)}
.ccnav .ci.cur{background:#0310260f;color:var(--text)}
.ccmain{flex:1;padding:32px 48px;overflow:auto}
.ccmain h1{font-size:24px;line-height:32px;margin:0 0 4px;font-weight:600}
.ccrow{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--divider)}
.ccrow .l{flex:1}.ccrow .l b{display:block;font-weight:500}.ccrow .l span{color:var(--muted)}

/* ============================ PERMISSION PROFILES ============================ */
.pwrap{flex:1;display:flex;min-height:0}
.pleft{width:300px;border-right:1px solid var(--divider);padding:16px 12px;overflow:auto}
.pleft h3{margin:0 8px 12px;font-size:16px;font-weight:600}
.pleft .pi{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-radius:var(--r)}
.pleft .pi.cur{background:#0310260f}.pleft .pi span:first-child{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmain{flex:1;overflow:auto;padding:0 0 24px}
.prow{display:grid;grid-template-columns:1fr repeat(5,128px);align-items:center;min-height:44px;border-bottom:1px solid var(--divider)}
.prow>div{padding:0 12px}
.prow .c{display:grid;place-items:center;height:100%}
.prow .c.sel{background:#126dfe0d}
.prow.h{position:sticky;top:0;background:#fff;z-index:3;min-height:56px}
.prow.h .c{font-size:12px;color:var(--muted);text-align:center;padding:0 8px}
.prow.s1 .lb{font-size:18px;font-weight:500;padding-left:24px}
.prow.s2 .lb{font-size:16px;padding-left:24px;display:flex;align-items:center;gap:8px;cursor:pointer}
.prow.s2.new{background:#126dfe08}
.prow.r .lb{padding-left:40px;color:var(--muted)}
.prow.r:hover{background:var(--sec-fill)}

/* ============================ FACE MANAGEMENT ============================ */
.fp{display:flex;flex-direction:column;height:100%;position:relative}
.pageheader{height:88px;flex:0 0 88px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:1px solid var(--divider)}
.pageheader .ttl{flex:1;min-width:0}
.pageheader .t1{font-size:18px;line-height:20px}.pageheader .t2{color:var(--muted)}
.toolbar{height:88px;flex:0 0 88px;display:flex;align-items:center;gap:8px;padding:0 24px}
.toolbar .sp{flex:1}
.chips{display:flex;gap:8px;margin-left:8px}
.sfield{width:260px}
.capb{background:var(--warn-surface);padding:10px 16px;border-radius:var(--r-l);margin-right:12px;line-height:20px;white-space:nowrap}
.nmt{display:flex;align-items:center;gap:12px;margin-right:12px}
.nmt .lb{white-space:nowrap;display:grid;text-align:right;line-height:18px}.nmt .lb small{color:var(--muted)}
.dd{position:relative}
.ddt{height:40px;white-space:nowrap;padding:0 8px;border-radius:var(--r);display:flex;align-items:center;gap:4px;color:var(--muted)}
.ddt:hover{background:var(--sec-fill)}
.dd .menu{top:44px;right:0;min-width:200px}
.slider{display:flex;align-items:center;gap:12px;color:var(--muted);margin-left:12px}
.slider input{-webkit-appearance:none;appearance:none;width:136px;height:4px;border-radius:2px;outline:0;background:linear-gradient(to right,var(--primary) var(--v,0%),var(--control) var(--v,0%))}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--card-stroke);box-shadow:var(--e1);cursor:pointer}
.pend{margin:0 24px 8px;display:flex;align-items:center;gap:12px;background:var(--warn-surface);border-radius:var(--r);padding:8px 8px 8px 16px}
.pend span{flex:1}
.fbody{flex:1;display:flex;min-height:0}
.gridwrap{flex:1;overflow-y:auto;padding:16px 24px 24px;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,var(--cw,148px));gap:24px;justify-content:center}
.card{width:var(--cw,148px);position:relative;cursor:pointer}
.thumb{width:var(--cw,148px);height:var(--cw,148px);border-radius:var(--r);overflow:hidden;position:relative;border:1px solid var(--card-stroke);background:var(--card-frame)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;user-select:none}
.card:hover .thumb{border-color:var(--card-stroke-hover)}
.card.sel .thumb{border:2px solid var(--primary)}
.card.peek .thumb{outline:2px solid var(--primary);outline-offset:2px}
.card.busy{pointer-events:none}.card.busy .thumb img{opacity:.55}
.card .nm{margin-top:8px;font-size:16px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ct{color:var(--muted)}
.cardmore,.cardsel{position:absolute;top:8px;display:none;place-items:center}
.cardmore{left:8px;width:32px;height:32px;border-radius:var(--r);background:#fffffff2;box-shadow:var(--e1)}
.cardsel{right:8px;width:26px;height:26px;border-radius:50%;border:2px solid #ffffffe6;background:#0310262b;color:#fff}
.card:hover .cardmore,.card:hover .cardsel,.card.sel .cardsel,.card.menuopen .cardmore{display:grid}
.card.sel .cardsel{background:var(--primary);border-color:var(--primary)}
.card .menu{top:44px;left:8px}
.prog{position:absolute;left:8px;right:8px;bottom:8px;height:4px;border-radius:2px;background:#ffffff80;overflow:hidden}
.prog i{position:absolute;top:0;bottom:0;width:40%;background:var(--primary);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.tfail{width:100%;height:100%;display:grid;place-items:center;color:var(--disabled);background:var(--card-frame)}
.skel{background:#0310260d;border-radius:var(--r);animation:pu 1.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.5}}
.skel.thumbs{width:var(--cw,148px);height:var(--cw,148px)}.skel.ln{height:14px;margin-top:10px}
.endbox{margin:32px auto 0;width:560px;display:flex;align-items:center;gap:12px;background:#0310260a;border-radius:var(--r-l);padding:12px 16px}
.endbox span{flex:1}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:0 24px 60px}
.empty .vis{width:72px;height:72px;border-radius:50%;background:#0310260a;display:grid;place-items:center;color:var(--text)}
.empty h2{margin:4px 0 0;font-size:18px;line-height:24px;font-weight:600}
.empty p{margin:0;color:var(--muted);max-width:420px}
.panel{width:336px;flex:0 0 336px;border-left:1px solid var(--divider);display:flex;flex-direction:column;min-height:0;position:relative}
.ph{display:flex;align-items:center;gap:12px;padding:20px 16px 20px 24px;border-bottom:1px solid var(--divider)}
.ph .who{flex:1;min-width:0}.ph .who div:first-child{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ph .who div:last-child{color:var(--muted)}
.ph .menu{top:60px;right:56px}
.mini{width:40px;height:40px;border-radius:var(--r);overflow:hidden;flex:0 0 40px;background:var(--card-frame);border:1px solid var(--card-stroke);display:grid;place-items:center;font-weight:500;color:var(--muted)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{flex:1;overflow:auto;min-height:0}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 24px 8px;font-size:16px}
.sh small{color:var(--muted);font-size:12px}
.li{display:flex;align-items:center;gap:12px;padding:0 16px 0 24px;height:56px;position:relative;cursor:pointer}
.li:hover{background:var(--sec-fill)}
.li .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .menu{top:44px;right:16px;min-width:200px}
.pf{display:flex;gap:8px;padding:16px 24px;border-top:1px solid var(--divider)}
.pf .btn{flex:1}.pf .btn.sec{flex:0 0 auto}
.bulk{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;background:#fff;box-shadow:var(--e4);border-radius:var(--r);display:flex;align-items:center;gap:4px;padding:6px 8px;z-index:30}
.bulk .cnt{min-width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;padding:0 6px;margin-right:4px}
.bulk .vd,.vd{width:1px;height:24px;background:var(--divider);margin:0 4px}
.bulk .dtxt{color:var(--danger)}
.toast{position:absolute;left:24px;bottom:24px;z-index:300;display:flex;align-items:center;gap:12px;background:#fff;box-shadow:var(--e2);border-radius:var(--r);padding:8px 8px 8px 12px;min-width:340px}
.toast .tk{width:28px;height:28px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center}
.toast .tm{flex:1}.toast .undo{color:var(--primary);padding:0 8px;height:32px;border-radius:var(--r)}.toast .undo:hover{background:var(--sec-fill)}
.backdrop{position:absolute;inset:0;background:#03102659;z-index:200;display:grid;place-items:center}
.modal{width:500px;background:#fff;border-radius:var(--r-xl);box-shadow:var(--e4);position:relative}
.modal.wide{width:1000px;height:620px;display:flex;overflow:hidden}
.mh{display:flex;align-items:center;gap:12px;padding:20px 20px 12px 24px}
.mh .mt{flex:1;font-size:18px;line-height:24px}
.mb{padding:4px 24px 24px;display:grid;gap:16px}
.mb p{margin:0}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:8px 24px 24px}
.mf.between{justify-content:space-between}
.sugs{border:1px solid var(--divider);border-radius:var(--r);box-shadow:var(--e2);overflow:hidden}
.sug{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px}
.sug+.sug{border-top:1px solid var(--divider)}.sug:hover{background:var(--sec-fill)}
.sug .sn{flex:1;min-width:0}.sug .sn small{display:block;color:var(--muted)}
.sug .mini{width:36px;height:36px;flex-basis:36px}
.pair{display:flex;align-items:flex-start;justify-content:center;gap:20px}
.pair .w{display:grid;gap:8px;justify-items:center;text-align:center}
.pair .big{width:128px;height:128px;border-radius:var(--r);overflow:hidden;border:1px solid var(--card-stroke)}
.pair .big img{width:100%;height:100%;object-fit:cover}
.pair small{color:var(--muted);display:block}
.pair .ar{margin-top:56px;color:var(--muted)}
.radio{display:flex;align-items:center;gap:12px;padding:6px 4px;border-radius:var(--r);cursor:pointer}
.radio:hover{background:var(--sec-fill)}.radio.dis{cursor:default;color:var(--disabled)}.radio.dis:hover{background:none}
.radio input{accent-color:var(--primary);width:18px;height:18px;margin:0}
.radio .rn{flex:1;min-width:0}.radio .rn small{display:block;color:var(--muted)}
.radio .why{color:var(--danger);font-size:12px;line-height:16px;max-width:150px;text-align:left}
.callout{background:var(--warn-surface);border-radius:var(--r);padding:12px 16px}
.confirm{display:grid;justify-items:center;gap:12px;text-align:center}
.confirm .big{width:240px;height:240px;border-radius:var(--r);overflow:hidden;border:1px solid var(--card-stroke)}
.confirm .big img{width:100%;height:100%;object-fit:cover}
.amain{flex:1;background:#0310260a;display:grid;place-items:center;padding:24px;position:relative}
.amain .pic{width:400px;height:400px;border-radius:var(--r);overflow:hidden;box-shadow:var(--e2)}.amain .pic img{width:100%;height:100%;object-fit:cover}
.amain .ttl{position:absolute;left:24px;top:20px;font-size:16px}
.aside{width:320px;border-left:1px solid var(--divider);display:flex;flex-direction:column}
.aside .ah{display:flex;align-items:center;padding:16px 12px 12px 20px;border-bottom:1px solid var(--divider)}
.aside .ah div{flex:1}.aside .ah small{display:block;color:var(--muted)}
.tagrow{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 20px;position:relative}
.tagrow .mini{width:32px;height:32px;flex-basis:32px}.tagrow .n{flex:1}
.tagrow .menu{top:40px;right:12px;min-width:240px}
.nmrow{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--divider)}
.nmsamples{display:flex;align-items:center;gap:var(--g,12px)}
.nmsamples .thumb{flex:0 0 auto}
.nmsamples .cnt{color:var(--muted);margin-left:8px}
.nmact{display:flex;align-items:center;gap:8px;margin-top:16px}
.nmact .inp{width:420px}
.nmhint{color:var(--muted);margin-top:8px}
.nmsugs{max-width:560px;margin-top:8px}
</style>
</head>

  <div id="app"></div>
</main>

function visible(){
  const f=S.f;let l=f.people.slice();
  if(f.filter==='named')l=l.filter(p=>p.name);
  if(f.filter==='unnamed')l=l.filter(p=>!p.name);
  const q=f.q.trim().toLowerCase();
  if(q.length>=2)l=l.filter(p=>label(p).toLowerCase().includes(q));
  const m=f.dir==='asc'?1:-1;
  l.sort((a,b)=>{
    if(f.sort==='name'){const A=a.name,B=b.name;if(!A&&!B)return a.id-b.id;if(!A)return 1;if(!B)return -1;return A.localeCompare(B)*m;}
    if(f.sort==='date')return (a.added-b.added)*m||a.id-b.id;
    return (a.count-b.count)*m||a.id-b.id;
  });
  return l;
}

}

function bulkBar(){
  const f=S.f;if(!f.sel.length||!canManage())return'';

  return `<div class="bulk" data-ds="Toolbar"><span class="cnt">${n}</span><span>${n===1?'person':'people'} selected</span><span class="vd"></span>
   <button class="btn clean" data-act="bulk-merge" ${cm?'':`disabled data-tip="${tipM}"`}>${ic('merge')}Merge</button>
   <button class="btn clean dtxt" data-act="bulk-remove" ${cr?'':`disabled data-tip="${tipR}"`}>${ic('remove')}Remove</button>
   <span class="vd"></span><button class="iconbtn" data-act="selclear" aria-label="Clear selection">${ic('close')}</button></div>`;
}

/* ------------------------------ name mode ------------------------------ */
function nmQueue(){
  const u=S.f.people.filter(p=>!p.name).sort((a,b)=>b.count-a.count);
  const sk=S.f.nmSkip;
  return u.filter(p=>!sk.includes(p.id)).concat(u.filter(p=>sk.includes(p.id)));
}
function nameModeView(){
  const f=S.f,q=nmQueue();
  if(!q.length)return emptyState('cleared');
  const a=q.find(p=>p.id===f.nmActive)||q[0];f.nmActive=a.id;
  const rest=q.filter(p=>p.id!==a.id);
  const d=f.nmDraft.trim();
  const sug=d?nameSuggestions(f.nmDraft,a.id):{rows:[],exact:null};
  const dups=sug.rows.filter(r=>r.type==='person');
  return `<div class="nmrow" data-ds="Name mode"><div class="nmsamples">${[0,1,2,3].map(i=>`<div class="thumb" style="width:148px;height:148px" data-ds="Thumbnail">${faceImg(a,i)}</div>`).join('')}<span class="cnt">${fmt(a.count)} assets</span></div>
   <div class="nmact"><div class="inp" data-ds="Input"><input id="nmInput" value="${esc(f.nmDraft)}" placeholder="Unnamed person" autocomplete="off"></div>
    <button class="btn pri" data-act="nm-save" ${(!d||sug.exact||d.length>150)?'disabled':''}>Save</button><button class="btn sec" data-act="nm-skip">Skip</button></div>
   ${dups.length?`<div class="sugs nmsugs">${dups.map(r=>sugRow(r)).join('')}</div>`:''}
   <div class="nmhint">Enter to save · Tab to skip · Esc to leave name mode</div></div>
   <div class="grid">${rest.map(cardHTML).join('')}</div>`;
}
function nameSuggestions(value,selfId){
  const t=value.trim().toLowerCase();if(!t)return{rows:[],exact:null};
  const named=S.f.people.filter(p=>p.name&&p.id!==selfId);
  const exact=named.find(p=>p.name.toLowerCase()===t);
  if(exact)return{rows:[{type:'person',p:exact}],exact};
  const part=named.filter(p=>p.name.toLowerCase().includes(t)).slice(0,3);
  return{rows:part.map(p=>({type:'person',p})).concat([{type:'new',text:value.trim()}]),exact:null};
}
function sugRow(r,act){
  if(r.type==='person')return `<button class="sug" data-act="${act||'sug-person'}" data-id="${r.p.id}" data-ds="Dropdown item"><span class="mini">${faceImg(r.p)}</span><span class="sn">${esc(r.p.name)}<small>Merge</small></span><span class="badge">${fmt(r.p.count)} assets</span></button>`;
  return `<button class="sug" data-act="sug-new" data-ds="Dropdown item"><span class="mini">${letter(r.text)}</span><span class="sn">${esc(r.text)}<small>Add as new person</small></span></button>`;
}

const mh=(inner)=>`<div class="mh" data-ds="Modal header">${inner}<button class="iconbtn" data-act="mclose" aria-label="Close">${ic('close')}</button></div>`;
const mf=(inner,between)=>`<div class="mf ${between?'between':''}" data-ds="Modal footer">${inner}</div>`;
function mergeBody(src,tgt){
  const total=src.count+tgt.count;
  if(!src.name)return `${fmt(src.count)} assets will be tagged as ${tgt.name}, for ${fmt(total)} in total. This can’t be undone.`;
  return `${src.name}’s ${fmt(src.count)} assets will be tagged as ${tgt.name}, for ${fmt(total)} in total. The name ${src.name} is removed, and this can’t be undone.`;
}

      ${over?'<div class="helper err">150 character limit</div>':`<div class="helper">Updates the name on ${fmt(p.count)} assets.</div>`}</div>

     mf(`<button class="btn sec" data-act="mclose">Cancel</button><button class="btn pri" data-act="rename-save" ${(!t.trim()||t.trim()===p.name||over||sug.exact)?'disabled':''}>Save</button>`);
  }else if(m.kind==='mergeFixed'){

      <div class="w"><div class="big">${faceImg(t,t.cover)}</div><div>${esc(t.name)}<small>${fmt(t.count)} assets</small></div></div></div><p>${esc(mergeBody(s,t))}</p></div>`+

  }else if(m.kind==='mergeChoose'){

      <div style="padding:16px 20px"><div class="pnote">Existing pattern: the asset AI modal. Per-asset correction stays here; there is no detach action in the panel.</div></div></div>`;
  }else if(m.kind==='sheet'){

    inner=mh(`<span class="mt">${esc(n.t)}</span>`)+`<div class="mb"><div><span class="pill ${n.st}" style="margin:0">${STLBL[n.st]}</span></div>${(n.con||[]).map(c=>`<p>${esc(c)}</p>`).join('')}${(n.open||[]).map(c=>`<p style="color:var(--danger)">${esc(c)}</p>`).join('')}<p style="color:var(--muted)">Nothing is prototyped here: any interaction would be invention rather than design.</p></div>`+mf(`<button class="btn sec" data-act="mclose">Close</button>`);

/* ------------------------------ render ------------------------------ */
function screenHTML(){
  if(S.screen==='bank')return bankPage();
  if(S.screen==='cc')return ccPage();
  if(S.screen==='perms')return permsPage();
  return facePage();
}
function render(){
  const g=$('.gridwrap'),gs=g?g.scrollTop:0,pb=$('.pbody'),ps=pb?pb.scrollTop:0,pm=$('.pmain'),pms=pm?pm.scrollTop:0;
  const ae=document.activeElement,fi=(ae&&ae.id&&app.contains(ae)&&ae.tagName==='INPUT'&&ae.type==='text')?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  app.innerHTML=screenHTML()+(S.screen==='face'||S.modal?'':'')+modalHTML()+toastHTML();
  const g2=$('.gridwrap');if(g2)g2.scrollTop=gs;const pb2=$('.pbody');if(pb2)pb2.scrollTop=ps;const pm2=$('.pmain');if(pm2)pm2.scrollTop=pms;
  const id=S.focus||(fi&&fi.id);S.focus=null;
  if(id){const n=document.getElementById(id);if(n){n.focus();if(fi&&fi.id===id){try{n.setSelectionRange(fi.s,fi.e);}catch(e){}}else{const l=n.value.length;try{n.setSelectionRange(l,l);}catch(e){}}}}
  $$('.menu[data-flip]').forEach(mn=>{const box=mn.closest('.gridwrap')||mn.closest('.panel')||app;const r=mn.getBoundingClientRect(),b=box.getBoundingClientRect();if(r.bottom>b.bottom-6)mn.classList.add('up');});
}

/* ------------------------------ actions ------------------------------ */
function startLoad(){
  if(!S.sim.slow)return;
  S.f.loading=true;setTimeout(()=>{S.f.loading=false;render();},1800);
}
function openFace(){S.hint=false;S.prev=S.screen==='face'?S.prev:S.screen;S.screen='face';S.menu=null;S.gearOpen=false;startLoad();}
function runMerge(srcId,tgtId){
  const f=S.f;f.work[srcId]=1;f.work[tgtId]=1;S.modal=null;f.sel=[];render();
  setTimeout(()=>{const s=person(srcId),t=person(tgtId);if(!s||!t)return;
    t.count+=s.count;f.people=f.people.filter(x=>x.id!==srcId);delete f.work[srcId];delete f.work[tgtId];
    if(f.peek===srcId)f.peek=t.id;toast(`Merged into ${t.name}.`);render();},2200);
}
function runRemove(id){
  const f=S.f,p=person(id);f.work[id]=1;S.modal=null;if(f.peek===id)f.peek=null;f.sel=f.sel.filter(x=>x!==id);render();
  setTimeout(()=>{f.people=f.people.filter(x=>x.id!==id);delete f.work[id];toast(`${p.name} removed successfully from ${fmt(p.count)} assets.`);render();},2400);
}
function nmAdvance(){
  const q=nmQueue(),f=S.f,i=q.findIndex(p=>p.id===f.nmActive);
  f.nmActive=(q[i+1]||q[0]||{}).id;f.nmDraft='';
}
function nmSave(){
  const f=S.f,d=f.nmDraft.trim(),p=person(f.nmActive);if(!d||!p||d.length>150)return;
  if(nameSuggestions(d,p.id).exact)return;
  p.name=d;f.nmDone++;
  const id=p.id;nmAdvance();toast(`Named ${d}.`,()=>{const x=person(id);if(x){x.name=null;f.nmDone=Math.max(0,f.nmDone-1);f.nmActive=id;}});
  S.focus='nmInput';render();
}
function nmSkip(){const f=S.f;if(f.nmActive&&!f.nmSkip.includes(f.nmActive))f.nmSkip.push(f.nmActive);nmAdvance();S.focus='nmInput';render();}
function nmExit(){S.f.nm=false;S.f.nmDraft='';S.f.filter='all';render();}

function act(a,d,e,el){
  const f=S.f;
  switch(a){
   case 'noop':return;
   case 'bd':if(e.target===el){S.modal=null;render();}return;
   case 'mclose':S.modal=null;S.menu=null;break;
   case 'toast-x':S.toast=null;break;
   case 'toast-undo':{const u=S.toast&&S.toast.undo;if(u)u();toast('Action undone.');break;}
   case 'go-bank':S.screen='bank';S.gearOpen=false;break;
   case 'go-perms':S.screen='perms';break;
   case 'bank-clear':S.bankFilter=null;break;
   case 'gear':S.gearOpen=!S.gearOpen;S.menu=null;break;
   case 'gear-go':S.gearOpen=false;S.screen=d.go;break;
   case 'cc-other':toast('Not part of this prototype.');break;
   case 'openface':openFace();break;
   case 'back':S.screen=S.prev&&S.prev!=='face'?S.prev:'bank';f.peek=null;break;
   case 'close':S.screen='bank';f.peek=null;break;
   case 'search':f.qOpen=!f.qOpen;if(f.qOpen)S.focus='qInput';else f.q='';break;
   case 'qclear':f.q='';f.state=f.state==='x'?null:f.state;S.focus='qInput';break;
   case 'chip':f.filter=d.f;f.nm=false;f.sel=[];break;
   case 'sortopen':S.sortOpen=!S.sortOpen;S.menu=null;break;
   case 'sortset':f.sort=d.v;f.dir=d.v==='name'?'asc':(d.v==='date'?'desc':'desc');S.sortOpen=false;break;
   case 'dir':f.dir=f.dir==='desc'?'asc':'desc';break;
   case 'pend-x':f.pend=false;break;
   case 'totop':{const g=$('.gridwrap');if(g)g.scrollTop=0;return;}
   case 'cap-search':f.qOpen=true;S.focus='qInput';break;
   case 'empty-upload':toast('Upload is not part of this prototype.');break;
   case 'cardmore':S.menu=(S.menu&&S.menu.kind==='card'&&S.menu.id===+d.id)?null:{kind:'card',id:+d.id};S.sortOpen=false;break;
   case 'peek':if(f.work[+d.id])return;f.peek=+d.id;S.menu=null;break;
   case 'sel':{const id=+d.id;f.sel=f.sel.includes(id)?f.sel.filter(x=>x!==id):f.sel.concat(id);break;}
   case 'selclear':f.sel=[];break;
   case 'mi-name':{const p=person(+d.id);S.menu=null;S.modal=p.name?{kind:'rename',id:p.id,value:p.name}:{kind:'name',id:p.id,value:'',step:'input'};S.focus=p.name?'renameInput':'nameInput';break;}
   case 'mi-merge':case 'pm-merge':S.menu=null;S.modal={kind:'mergePick',id:+d.id,q:''};S.focus='pickInput';break;
   case 'mi-assets':S.menu=null;f.peek=+d.id;break;
   case 'mi-remove':case 'pm-remove':S.menu=null;S.modal={kind:'remove',id:+d.id,value:''};S.focus='confirmInput';break;
   case 'panelclose':f.peek=null;S.menu=null;break;
   case 'panelmore':S.menu=(S.menu&&S.menu.kind==='panel')?null:{kind:'panel'};break;
   case 'panel-name':{const p=person(f.peek);S.modal=p.name?{kind:'rename',id:p.id,value:p.name}:{kind:'name',id:p.id,value:'',step:'input'};S.focus=p.name?'renameInput':'nameInput';break;}
   case 'panel-assets':{const p=person(f.peek);S.bankFilter={name:label(p),count:p.count};S.prev='face';S.screen='bank';break;}
   case 'rowmore':S.menu=(S.menu&&S.menu.kind==='row'&&S.menu.i===+d.i)?null:{kind:'row',i:+d.i};break;
   case 'row-view':S.menu=null;S.modal={kind:'asset',pid:f.peek,i:+d.i};break;
   case 'row-cover':{const p=person(f.peek);S.menu=null;const was=p.cover;p.cover=(p.cover+1)%VAR.length;toast('Cover updated.',()=>{p.cover=was;});break;}
   case 'tagmore':S.menu=(S.menu&&S.menu.kind==='tag')?null:{kind:'tag'};break;
   case 'tag-person':S.modal=null;S.menu=null;break;
   case 'notme':{const p=person(S.modal.pid);p.count=Math.max(0,p.count-1);S.modal=null;S.menu=null;toast(`${p.name} removed from this asset.`,()=>{p.count+=1;});break;}
   case 'nameclear':S.modal.value='';S.focus='nameInput';break;
   case 'renameclear':S.modal.value='';S.focus='renameInput';break;
   case 'name-next':{const m=S.modal,v=m.value.trim();if(!v||v.length>150||nameSuggestions(v,m.id).exact)return;m.step='done';m.final=v;break;}
   case 'sug-new':{const m=S.modal;m.final=m.value.trim();if(!m.final||m.final.length>150)return;m.step='done';break;}
   case 'name-back':S.modal.step='input';S.focus='nameInput';break;
   case 'name-done':{const m=S.modal;person(m.id).name=m.final;S.modal=null;break;}
   case 'sug-person':{const m=S.modal;S.modal={kind:'mergeFixed',src:m.id,tgt:+d.id};break;}
   case 'pick-person':S.modal={kind:'mergeFixed',src:S.modal.id,tgt:+d.id};break;
   case 'rename-save':{const m=S.modal,p=person(m.id),was=p.name;p.name=m.value.trim();S.modal=null;toast(`Renamed to ${p.name}.`,()=>{p.name=was;});break;}
   case 'merge-go':runMerge(S.modal.src,S.modal.tgt);return;
   case 'bulk-merge':{if(f.sel.length!==2)return;const ps=f.sel.map(person).sort((a,b)=>(b.name?1:0)-(a.name?1:0)||b.count-a.count);S.modal={kind:'mergeChoose',ids:f.sel.slice(),keep:ps[0].name?ps[0].id:ps[1].id};break;}
   case 'merge-go2':{const m=S.modal,other=m.ids.find(i=>i!==m.keep);runMerge(other,m.keep);return;}
   case 'bulk-remove':{const p=person(f.sel[0]);if(f.sel.length!==1||!p||!p.name)return;S.modal={kind:'remove',id:p.id,value:''};S.focus='confirmInput';break;}
   case 'remove-go':runRemove(S.modal.id);return;
   case 'nm-toggle':{f.nm=!f.nm;if(f.nm){f.filter='unnamed';f.peek=null;f.sel=[];f.nmDraft='';f.nmDone=0;f.nmSkip=[];f.nmTotal=f.people.filter(p=>!p.name).length;f.nmActive=(nmQueue()[0]||{}).id;S.focus='nmInput';}else f.filter='all';break;}
   case 'nm-save':nmSave();return;
   case 'nm-skip':nmSkip();return;
   case 'nm-dup':case 'nm-exit':break;
   case 'perm-toggle':{const pr=S.profiles.find(x=>x.id===d.p);pr.p[d.k]=pr.p[d.k]?0:1;S.permsSel=pr.id;break;}
   case 'perm-sel':S.permsSel=d.p;break;
   case 'perm-sec':S.permsClosed[d.s]=!S.permsClosed[d.s];break;
   default:return;
  }
  render();
}

/* ------------------------------ events ------------------------------ */
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  const a=el?el.dataset.act:null;
  const keep=/^(cardmore|panelmore|rowmore|sortopen|gear|tagmore)$/.test(a||'');
  let changed=false;
  if(!e.target.closest('.menu')&&!keep&&(S.menu||S.sortOpen||S.gearOpen)){S.menu=null;S.sortOpen=false;S.gearOpen=false;changed=true;}
  if(el&&a!=='noop'){
    // sug-person inside name mode uses the active cluster as the source
    if(a==='sug-person'&&!S.modal){S.modal={kind:'mergeFixed',src:S.f.nmActive,tgt:+el.dataset.id};render();return;}
    act(a,el.dataset,e,el);
  }else if(changed)render();
});
app.addEventListener('input',e=>{
  const t=e.target,id=t.id,f=S.f;
  if(id==='qInput'){f.q=t.value;render();}
  else if(id==='nameInput'){S.modal.value=t.value;render();}
  else if(id==='renameInput'){S.modal.value=t.value;render();}
  else if(id==='confirmInput'){S.modal.value=t.value;render();}
  else if(id==='pickInput'){S.modal.q=t.value;render();}
  else if(id==='nmInput'){f.nmDraft=t.value;render();}
  else if(id==='size'){f.size=+t.value;t.style.setProperty('--v',t.value+'%');const fp=$('.fp');if(fp)fp.style.setProperty('--cw',(148+Math.round(f.size*0.9))+'px');}
});
app.addEventListener('change',e=>{
  if(e.target.name==='keep'){S.modal.keep=+e.target.value;render();}
});
app.addEventListener('keydown',e=>{
  const id=e.target.id;
  if(id==='nameInput'&&e.key==='Enter'){e.preventDefault();act('name-next',{},e);}
  else if(id==='renameInput'&&e.key==='Enter'){e.preventDefault();const m=S.modal,p=person(m.id);if(m.value.trim()&&m.value.trim()!==p.name&&!nameSuggestions(m.value,m.id).exact)act('rename-save',{},e);}
  else if(id==='confirmInput'&&e.key==='Enter'){e.preventDefault();const m=S.modal,p=person(m.id);if((m.value||'').trim().toLowerCase()===p.name.toLowerCase())runRemove(m.id);}
  else if(id==='nmInput'){
    if(e.key==='Enter'){e.preventDefault();nmSave();}
    else if(e.key==='Tab'){e.preventDefault();nmSkip();}
    else if(e.key==='Escape'){e.preventDefault();nmExit();}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(S.modal){S.modal=null;render();}
  else if(S.menu||S.sortOpen||S.gearOpen){S.menu=null;S.sortOpen=false;S.gearOpen=false;render();}
  else if(S.f.nm&&S.screen==='face'&&e.target.id!=='nmInput'){nmExit();}
});
document.addEventListener('mouseover',e=>{
  const lab=$('#dslabel');if(!S.ds){lab.style.display='none';return;}
  const chain=[];let el=e.target.closest&&e.target.closest('[data-ds]');
  while(el&&chain.length<3){chain.push(el.dataset.ds);el=el.parentElement&&el.parentElement.closest('[data-ds]');}
  if(!chain.length){lab.style.display='none';return;}
  lab.textContent=chain.join('  <  ');lab.style.display='block';lab.style.left=(e.clientX+12)+'px';lab.style.top=(e.clientY+14)+'px';
});

/* ------------------------------ notes + scenarios ------------------------------ */
const STLBL={ready:'Ready',open:'Open question',proposed:'Proposed',blocked:'Blocked',unscoped:'Unscoped'};
const NOTES={
 bank:{st:'open',t:'Entry: asset bank',con:['An icon button in the asset bank toolbar, beside Duplicate Manager. It only renders for profiles with Access face recognition management.','The route is added in pybynder (shell-svc can serve it if the unified header is not needed).'],open:['Entry point is undecided: Settings (PRD), asset bank, or AI Control Center.']},

 perms:{st:'proposed',t:'Permission profiles',ep:'access-control-svc (new permission type)',con:['Two new rows under Asset Bank > Face Recognition, named like the existing verb + object permissions: Tag faces, Access face recognition management.','Page access and tagging are separate. Access without Tag faces is the read-only page.','Migration is data, not UI: profiles with Edit assets get Tag faces pre-checked at release.','Try it: untick Access for a profile, then View as that profile.'],open:['Do existing Edit assets holders also get page access at release?']},

 loading:{st:'ready',t:'Loading',con:['Thumbnails need a second request per page (about 48 without a grouping endpoint), so skeletons and chip spinners hold until counts arrive.']},
 enew:{st:'ready',t:'Empty: new customer',con:['Distinct from still detecting. Getting these confused tells an admin with 260K assets that they have no people.']},
 edetect:{st:'ready',t:'Empty: still detecting',con:['Existing assets are detected after the feature is enabled (KB). The page is empty but not finished.']},
 esearch:{st:'ready',t:'Empty: no search results',con:['Search runs from the 2nd letter, Spotlight style.'],open:['Type-ahead or Enter-to-search is undecided. Counts in a dropdown need a new Lucy endpoint (Bogdan).']},
 thumbfail:{st:'ready',t:'Thumbnail failed',con:['Thumbnails are bounding-box crops from whichever detection was chosen, not picked photos. Expect poor crops, which is why Use as cover matters.','A failed crop falls back to a neutral tile. Name and count must still read.']},
 cap:{st:'open',t:'Over 1,500 people',con:['Asset search caps groups at 1,500. The banner says so up front. The footer explains the way out, since search is not capped.','Sorting by name silently drops anyone past 1,500. Asset count descending is the safe default.'],open:['Filip is checking whether the limit can be raised. Valeria is checking real volumes.']},
 name:{st:'ready',t:'Name a person',ep:'PATCH /people/{id}',con:['Two steps: Next shows the confirmation, Done commits. Figma does not say where the commit happens, so the prototype commits on Done.','150 characters including spaces (KB).']},
 nameexact:{st:'ready',t:'Name matches an existing person',ep:'PATCH returns 409 with the conflicting person',con:['An exact match offers only Merge. Duplicate names are blocked at save (Eng, 29 Sep), so Add as new person never applies.','Picking the row goes to the merge confirmation with the direction already decided.']},
 namepart:{st:'ready',t:'Partial match',con:['Partial matches list the existing people with Merge and their counts, plus Add as new person as the last row.']},
 rename:{st:'ready',t:'Rename',ep:'PATCH /people/{id}',con:['Renaming updates the metaproperty option, so the new name shows on every asset, the smart filter and search.','Typing an existing name routes to merge. The toast carries Undo.']},
 nameerr:{st:'ready',t:'Error: 150 characters',con:['Inline error, red border, Next disabled.']},
 namemode:{st:'proposed',t:'Name mode',con:['Depends on Eng listing individual unnamed people. Enter saves, Tab skips, Esc exits. Duplicate detection runs inline.','Clusters are ordered by count so each name covers the most assets.','Not a person is not offered: Hide is unscoped. The Figma frames still show it.'],open:['Skipped clusters are re-offered at the end of the queue.']},
 merge2:{st:'ready',t:'Merge two',ep:'POST /people/merge {primaryId, secondaryIds[]} returns 202',con:['Select exactly two people, then Merge. Choose the name to keep. An unnamed record cannot be kept.','Merge is irreversible. No audit log exists for any action (Eng, 29 Sep).','Pairs only. Three or more is unscoped.'],open:['The PRD says merge is reversible via the audit log. That mechanism does not exist.']},

const SC=[
 ['Entry',[['bank','Asset bank entry','open'],['cc','AI Control Center entry','open'],['perms','Permission profiles','proposed']]],
 ['Library',[['lib','Loaded','ready'],['loading','Loading','ready'],['enew','Empty: new customer','ready'],['edetect','Empty: still detecting','ready'],['esearch','Empty: no search results','ready'],['thumbfail','Thumbnail failed','ready'],['cap','Over 1,500 people','open']]],
 ['Naming',[['name','Name a person','ready'],['nameexact','Matches an existing person','ready'],['namepart','Partial match','ready'],['rename','Rename and undo','ready'],['nameerr','Error: 150 characters','ready'],['namemode','Name mode','proposed']]],
 ['Merge',[['merge2','Merge two','ready'],['mergepick','Merge into…','open'],['mergeblocked','Unnamed cannot be kept','ready'],['mergeasync','Async progress','ready']]],
 ['Person',[['panel','Open panel','open'],['asset','View asset','ready'],['vis','Visibility restrictions','open']]],
 ['Remove',[['remove','Remove person','open'],['removecoll','With collection warning','ready']]],
 ['Access',[['readonly','Read-only','open'],['noaccess','No access','open']]],
 ['Out of scope or blocked',[['hide','Hide / not a person','unscoped'],['inactive','Mark inactive','unscoped'],['merge3','Merge three or more','unscoped'],['unmerge','Unmerge / split','blocked'],['queue','Unnamed review queue','blocked'],['unname','Remove name (person level)','open']]]
];
function resetFace(){S.f=newFace();S.modal=null;S.menu=null;S.sortOpen=false;S.gearOpen=false;S.toast=null;S.bankFilter=null;}
function runScenario(k){
  resetFace();S.scen=k;S.hint=false;
  if(!['readonly','noaccess'].includes(k)&&S.role!=='admin'&&['bank','cc','perms','lib'].indexOf(k)<0){S.role='admin';}
  const f=S.f,first=(fn)=>f.people.find(fn);
  const face=()=>{S.prev='bank';S.screen='face';};
  switch(k){
   case 'bank':S.screen='bank';S.hint=true;break;
   case 'cc':S.screen='cc';break;
   case 'perms':S.screen='perms';break;
   case 'lib':face();break;
   case 'loading':face();f.loading=true;break;
   case 'enew':face();f.state='new';break;
   case 'edetect':face();f.state='detecting';break;
   case 'esearch':face();f.qOpen=true;f.q='John Stamos';break;
   case 'thumbfail':face();f.thumbFail=true;break;
   case 'cap':face();S.sim.cap=true;break;
   case 'name':face();S.modal={kind:'name',id:first(p=>!p.name).id,value:'',step:'input'};S.focus='nameInput';break;
   case 'nameexact':face();S.modal={kind:'name',id:first(p=>!p.name).id,value:'Bob Whitfield',step:'input'};break;
   case 'namepart':face();S.modal={kind:'name',id:first(p=>!p.name).id,value:'Ma',step:'input'};break;
   case 'rename':face();S.modal={kind:'rename',id:1,value:'Bob Whitfield'};S.focus='renameInput';break;
   case 'nameerr':face();S.modal={kind:'name',id:first(p=>!p.name).id,value:'Marta Rogers '+'abcdefghij'.repeat(14),step:'input'};break;
   case 'namemode':face();f.nm=true;f.filter='unnamed';f.nmTotal=f.people.filter(p=>!p.name).length;f.nmActive=(nmQueue()[0]||{}).id;S.focus='nmInput';break;
   case 'merge2':face();f.sel=[19,2];S.modal={kind:'mergeChoose',ids:[19,2],keep:2};break;
   case 'mergepick':face();S.modal={kind:'mergePick',id:first(p=>!p.name).id,q:''};S.focus='pickInput';break;
   case 'mergeblocked':face();{const u=first(p=>!p.name).id;f.sel=[u,1];S.modal={kind:'mergeChoose',ids:[u,1],keep:1};}break;
   case 'mergeasync':face();setTimeout(()=>{if(S.scen==='mergeasync')runMerge(19,2);},50);break;
   case 'panel':face();f.peek=2;break;
   case 'asset':face();f.peek=2;S.modal={kind:'asset',pid:2,i:0};break;
   case 'vis':face();S.sim.vis=true;f.peek=2;break;
   case 'remove':face();S.modal={kind:'remove',id:2,value:''};S.focus='confirmInput';break;
   case 'removecoll':face();S.modal={kind:'remove',id:1,value:''};S.focus='confirmInput';break;
   case 'readonly':S.role='viewer';face();f.peek=2;break;
   case 'noaccess':S.role='guest';face();break;
   default:face();S.modal={kind:'sheet',key:k};break;
  }
  render();renderDev();
}

/* ------------------------------ dev panel ------------------------------ */
function renderDev(){
  const d=$('#dev'),pr=prof(),a=canAccess(),m=canManage(),n=NOTES[S.scen];
  d.innerHTML=`<div class="dh"><b>Face Recognition management</b><small>Dev prototype v2 · Q4 2026 rework</small>
   <p class="hint" style="margin-top:8px">Behaviour, states and copy for the flows in the Figma section. Tokens and component names are read from the Bynder DS. Reflects everything decided up to the 29 Sep eng sync.</p></div>
  <section><h2>View as</h2><select id="roleSel">${S.profiles.map(p=>`<option value="${p.id}" ${p.id===S.role?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
   <p class="hint">Access: <b>${a?'yes':'no'}</b> · Tag faces: <b>${pr.p.tag?'yes':'no'}</b> → ${!a?'no entry point':!m?'read-only page':'full access'}. Edit the profiles in Permission profiles.</p></section>
  <section><h2>Simulate</h2>
   <label class="tgl"><input type="checkbox" data-sim="slow" ${S.sim.slow?'checked':''}> Slow load (skeleton on open)</label>
   <label class="tgl"><input type="checkbox" data-sim="cap" ${S.sim.cap?'checked':''}> Portal over 1,500 people</label>
   <label class="tgl"><input type="checkbox" data-sim="vis" ${S.sim.vis?'checked':''}> Visibility restrictions</label>
   <label class="tgl"><input type="checkbox" id="dsToggle" ${S.ds?'checked':''}> Show DS component names (hover)</label></section>
  <section><h2>Scenarios</h2>${SC.map(g=>`<div class="grp">${g[0]}</div>${g[1].map(s=>`<button class="scen ${S.scen===s[0]?'cur':''}" data-scen="${s[0]}"><span class="l">${s[1]}</span><span class="pill ${s[2]}">${STLBL[s[2]]}</span></button>`).join('')}`).join('')}</section>
  ${n?`<section class="note"><h2>This scenario</h2><h3>${esc(n.t)}</h3><span class="pill ${n.st}" style="margin:0">${STLBL[n.st]}</span>${n.ep?`<p class="hint"><code>${esc(n.ep)}</code></p>`:''}<ul>${(n.con||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>${(n.open||[]).length?`<div class="q">Open</div><ul>${n.open.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}</section>`:''}
  <section><h2>Decisions reflected</h2><ul class="hint" style="padding-left:18px;margin:0"><li>Bulk remove is a full wipe, one person at a time, no audit log, no restore.</li><li>No audit log anywhere, so merge is irreversible.</li><li>Hide, Mark inactive and merging three or more are unscoped.</li><li>Asset search caps groups at 1,500.</li><li>Person-level remove name needs backend work, not built.</li><li>Individual unnamed people are pending Eng.</li></ul></section>
  <section><button class="resetbtn" id="resetAll">Reset prototype</button></section>`;
}
$('#dev').addEventListener('click',e=>{
  const s=e.target.closest('[data-scen]');if(s){runScenario(s.dataset.scen);return;}
  if(e.target.id==='resetAll'){S.profiles=baseProfiles();S.role='admin';S.sim={cap:false,vis:false,slow:false};S.permsClosed={};runScenario('bank');}
});
$('#dev').addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='roleSel'){S.role=t.value;S.f.sel=[];S.f.nm=false;S.menu=null;render();renderDev();}
  else if(t.dataset.sim){S.sim[t.dataset.sim]=t.checked;render();}
  else if(t.id==='dsToggle'){S.ds=t.checked;document.body.classList.toggle('dsl',S.ds);}
});
$('#devtoggle').innerHTML=ic('panelico',18);
$('#devtoggle').addEventListener('click',()=>{S.devOpen=!S.devOpen;document.body.classList.toggle('devclosed',!S.devOpen);setTimeout(fit,230);fit();});

function fit(){
  const w=$('#stagewrap'),s=Math.min(1,(w.clientWidth-40)/1280,(w.clientHeight-40)/832);
  app.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fit);
// permission edits change who the viewer is, so the dev panel hint must follow
const _render=render;
render=function(){_render();};
runScenario('bank');fit();
})();
</script>
