<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CXUC · Bulk actions and bulk sharing prototype</title>
<style>
/* Tokens read from the Figma frames (CXUC Refinement Stories). Hover states of primary/secondary were not in the frames and are derived. */
:root{
  --primary:#126dfe; --primary-pressed:#093986; --primary-hover:#0d5fe0; --primary-disabled:rgba(18,109,254,.4);
  --text:rgba(3,16,38,.88); --text-2:rgba(3,16,38,.70); --text-3:rgba(3,16,38,.46);
  --text-dark:#212c40; --text-sub:#4f5867;
  --border:rgba(3,16,38,.17); --line:rgba(3,16,38,.10); --hover:rgba(3,16,38,.05);
  --btn-fill:rgba(3,16,38,.03); --btn-hover:rgba(3,16,38,.07); --chip:rgba(3,16,38,.05); --badge:rgba(3,16,38,.07);
  --ok-bg:#e3f2e7; --ok-text:#0e6765; --toast-ok:#35a284; --thumb:#d5d7da; --card:#f8f8f9; --danger:#c62828;
  --overlay:rgba(3,16,38,.20);
  --shadow-modal:0 8px 12px rgba(3,16,38,.10),0 0 1px rgba(3,16,38,.10);
  --shadow-toast:0 2px 8px rgba(3,16,38,.15),0 0 0 rgba(3,16,38,.10);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Inter Variable",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:20px;color:var(--text);background:#fff;min-width:1100px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block;fill:currentColor}
.ico{width:24px;height:24px;flex:none}
.ico.s{width:20px;height:20px}
/* Buttons (DS Button: 40h, r6, pad 0/12, gap 4) */
.btn{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:6px;white-space:nowrap;color:var(--text);position:relative}
.btn .lbl{padding:0 4px}
.btn:hover{background:var(--hover)}
.btn.sec{background:var(--btn-fill);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sec:hover{background:var(--btn-hover)}
.btn.pri{background:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-hover)}
.btn.pri:active{background:var(--primary-pressed)}
.btn.pri[disabled]{background:var(--primary-disabled);cursor:not-allowed}
.btn.icon{width:48px;justify-content:center;padding:0}
.btn.sm{height:32px;padding:0 8px}
.btn.on{background:var(--hover)}
.btn[disabled]{cursor:not-allowed}
.btn.sec[disabled]{opacity:.5}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#031026;color:#fff;font-size:14px;line-height:20px;padding:6px 12px;border-radius:6px;white-space:nowrap;z-index:300;pointer-events:none}
/* Header */
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text-3)}
.search input{border:0;outline:0;flex:1;font:inherit;color:var(--text);background:none;min-width:0}
.search input::placeholder{color:var(--text-3)}
.top .search{position:absolute;left:50%;transform:translateX(-50%);width:400px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--hover);display:grid;place-items:center;font-weight:600}
.nav{height:56px;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 0;border-bottom:1px solid var(--line)}
.logo{width:159px;padding:0 24px;display:flex;align-items:center;gap:6px;color:var(--primary);font-weight:700;font-size:22px;letter-spacing:-.5px}
.nav .links{display:flex;flex:1}
/* Layout */
.layout{display:flex;height:calc(100vh - 120px)}
.sidebar{width:272px;flex:none;padding:12px 0;border-right:1px solid var(--line);overflow:auto}
.sb-sec{padding:0 16px;display:flex;flex-direction:column;gap:2px}
.sb-item{display:flex;align-items:center;gap:8px;height:40px;padding:2px 12px;border-radius:6px;color:var(--text)}
.sb-item.act{background:var(--hover)}
.sb-item .n{margin-left:auto;font-size:14px;color:var(--text-2)}
.sb-item .ico{color:var(--text-sub)}
.sb-div{height:1px;background:var(--line);margin:8px 0}
.main{flex:1;overflow:auto;position:relative}
.phead{height:88px;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.phead .title{font-weight:700;font-size:16px;white-space:nowrap}
.phead .title.sel{font-weight:400}
.actions{display:flex;gap:12px}
.tool{height:64px;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.tool .search{width:334px}
.tool .r{display:flex;gap:4px;align-items:center}
.vdiv{width:1px;height:40px;background:rgba(0,34,51,.05);margin:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,256px);gap:20px 24px;padding:10px 24px 40px}
/* Cards (DS Card: 256x220, thumb 160, r6) */
.card{width:256px;height:220px;position:relative;cursor:pointer}
.thumb{position:relative;height:160px;border-radius:6px;background:var(--thumb);box-shadow:inset 0 0 0 1px var(--line)}
.card.sel .thumb::before{content:"";position:absolute;inset:-2px;border:2px solid var(--primary);border-radius:8px;pointer-events:none}
.selbtn{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--border);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .1s}
.card:hover .selbtn,.card.sel .selbtn,.anysel .selbtn{opacity:1}
.card.sel .selbtn{background:var(--primary);box-shadow:none}
.selbtn .ico{width:20px;height:20px}
.card:not(.sel) .selbtn .ico{display:none}
.card:not(.sel) .selbtn:hover{background:var(--hover)}
.cinfo{padding:8px 0}
.ctitle{color:var(--text-dark);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{color:var(--text-sub);font-size:14px}
.ctype{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.9);color:var(--text-2);font-size:12px;line-height:16px;padding:2px 6px;border-radius:5px}
/* Popover menu (DS Dropdown) */
.menu{position:fixed;z-index:250;background:#fff;border-radius:8px;box-shadow:var(--shadow-modal);padding:8px;min-width:200px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 12px;border-radius:6px;text-align:left;color:var(--text-dark)}
.menu button:hover:not([disabled]){background:var(--hover)}
.menu button[disabled]{color:var(--text-3);cursor:not-allowed}
.menu .chk{margin-left:auto;color:var(--primary)}
/* Modal / dialog (DS Modal: r12, header 72, footer 88) */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:100;display:grid;place-items:center}
.dlg{width:520px;background:#fff;border-radius:12px;box-shadow:var(--shadow-modal);display:flex;flex-direction:column}
.mhead{min-height:72px;padding:16px 24px;display:flex;align-items:center;gap:12px}
.mhead .ttl{flex:1;font-size:16px;color:var(--text-dark)}
.mhead .thumbi{width:40px;height:40px;border-radius:8px;background:var(--hover);display:grid;place-items:center}
.mbody{padding:16px 24px}
.mbody p{margin:0;padding:8px 0;font-size:14px;line-height:21px;color:var(--text-dark)}
.mfoot{height:88px;padding:24px;display:flex;align-items:center;gap:12px}
.mfoot .sp{flex:1}
.fld label{display:block;font-size:14px;margin-bottom:8px;color:var(--text-dark)}
.select{width:100%;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text-3);text-align:left}
.select.has{color:var(--text)}
.big{width:min(1232px,calc(100vw - 48px));height:min(874px,calc(100vh - 44px));background:#fff;border-radius:12px;box-shadow:var(--shadow-modal);display:flex;flex-direction:column;overflow:hidden}
.big .mbody{flex:1;overflow:auto;padding:16px 24px}
/* Table */
.thead,.tr{display:grid;align-items:start}
.thead{height:40px;align-items:center;color:var(--text-dark);position:sticky;top:-16px;background:#fff;z-index:2;margin-top:-4px}
.thead span{padding:0 16px}
.thead .b{font-weight:600}
.cols-view{grid-template-columns:minmax(300px,1.05fr) 140px minmax(300px,1.4fr) 170px}
.cols-edit{grid-template-columns:minmax(300px,1.05fr) 150px minmax(300px,1.4fr) 170px 84px}
.cols-choose{grid-template-columns:minmax(360px,1fr) 200px}
.tr{border-bottom:1px solid var(--line);padding:4px 0;min-height:56px;position:relative}
.tr:last-child{border-bottom:0}
.tr>div{padding:4px 16px;min-height:48px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.tr.chg::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--primary)}
.main-c{gap:12px!important;flex-wrap:nowrap!important}
.chev{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;flex:none;color:var(--text)}
.chev:hover{background:var(--hover)}
.chev.none{visibility:hidden}
.mthumb{width:40px;height:40px;border-radius:8px;background:var(--hover);display:grid;place-items:center;flex:none;color:var(--text)}
.mt{display:flex;flex-direction:column;min-width:0}
.mt .nm{color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .sb{font-size:14px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inh{align-self:flex-start;margin-top:6px;font-size:12px;line-height:16px;padding:4px 8px;border-radius:5px;background:var(--badge);color:var(--text-2);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9999px;background:var(--chip);font-size:14px;color:var(--text-dark);white-space:nowrap}
.pill .ico{width:20px;height:20px}
button.pill:hover{background:var(--btn-hover)}
.pill.more{padding:0 12px}
.pill.round{padding:0;width:32px;justify-content:center;background:#fff;box-shadow:inset 0 0 0 1px var(--border)}
.pill.ok{background:var(--ok-bg);color:var(--ok-text);height:32px}
.pill.off{background:var(--chip);color:var(--text-dark)}
.pcount{font-size:14px;color:var(--text-dark);margin-left:auto}
.c-pub{justify-content:flex-end}
/* Checkbox + toggle */
.cb{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(3,16,38,.28);display:grid;place-items:center;color:#fff;flex:none;background:#fff}
.cb.on,.cb.ind{background:var(--primary);box-shadow:none}
.cb.dis{background:rgba(3,16,38,.07);box-shadow:none;cursor:not-allowed}
.cb .ico{width:14px;height:14px}
.cb:not(.on) .ico.ck,.cb:not(.ind) .ico.im{display:none}
.tgl{width:40px;height:24px;border-radius:12px;background:var(--border);position:relative;flex:none;transition:background .12s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .12s}
.tgl.on{background:var(--primary)}
.tgl.on::after{left:18px}
/* Edit mode sharing */
.shr{display:flex;flex-direction:column;gap:8px;width:100%}
.shr .inp{height:40px}
.inp{display:flex;align-items:center;border:1px solid var(--border);border-radius:6px;padding:8px 12px;background:#fff}
.inp input{border:0;outline:0;font:inherit;width:100%;background:none}
.inp input::placeholder{color:var(--text-3)}
.inp:focus-within{box-shadow:0 0 0 2px var(--primary)}
.gr{display:flex;justify-content:space-between;align-items:center}
.gr .pill{padding:0 12px}
.gr .x{margin-left:4px;color:var(--text-3);width:18px;height:18px;display:grid;place-items:center;border-radius:50%}
.gr .x:hover{background:var(--btn-hover);color:var(--text)}
.rolebtn{width:96px;justify-content:space-between}
.rolebtn[disabled]{color:var(--text-3)}
.err{grid-column:1/-1;margin:0 16px 4px;padding:8px 12px;border-radius:6px;background:#fdecea;color:#8a1c1c;font-size:14px;display:flex;gap:8px;align-items:center}
.tr>div.ra{padding:4px 8px 4px 0;flex-wrap:nowrap}
.rowact{display:flex;gap:4px;flex-wrap:nowrap}
.rowact button{width:32px;height:32px;border-radius:6px;display:grid;place-items:center}
.rowact button:hover:not([disabled]){background:var(--hover)}
.rowact button[disabled]{opacity:.35;cursor:not-allowed}
.rowact button.src{background:rgba(18,109,254,.12);color:var(--primary)}
/* Toast (DS Notification) */
#toasts{position:fixed;left:24px;bottom:24px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{width:480px;max-width:calc(100vw - 48px);background:#fff;border-radius:8px;box-shadow:var(--shadow-toast);display:flex;align-items:center;gap:16px;padding:16px;animation:in .18s ease-out}
.toast .ok{width:40px;height:40px;border-radius:50%;background:var(--toast-ok);display:grid;place-items:center;color:#fff;flex:none}
.toast .t{flex:1;color:var(--text-dark)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hint{position:fixed;right:16px;bottom:12px;z-index:50;font-size:12px;line-height:16px;color:var(--text-3);background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 10px;max-width:340px}
</style>
</head>

<div id="app"></div>
<div id="layer"></div>
<div id="toasts" aria-live="polite"></div>

function walk(n,fn){fn(n);n.children.forEach(c=>walk(c,fn));}
function link(n,p){n.parent=p||null;n.children.forEach(c=>link(c,n));}

const pagesOf=n=>{const a=[];walk(n,x=>{if(x.kind==='page')a.push(x);});return a;};
const pubCount=n=>{const p=pagesOf(n);return [p.filter(x=>x.pub).length,p.length];};
function people(share){const s=new Set();share.forEach(g=>{(GROUP_MEMBERS[g.name]||[g.name]).forEach(x=>s.add(x));});return s;}
function wider(child,parent){
  if(RANK[child.vis]>RANK[parent.vis]) return true;
  const pp=people(parent.share); for(const x of people(child.share)) if(!pp.has(x)) return true; return false;
}
function validate(n){
  if(n.parent && wider(n,n.parent)) return `Can't apply this. It would give access beyond the ${n.parent.kind==='guide'?'guide':'chapter'}.`;
  for(const c of n.children) if(wider(c,n)) return `Can't apply this. Pages below would have wider access than this ${n.kind==='guide'?'guide':'chapter'}.`;
  return null;
}
const sig=n=>JSON.stringify({v:n.vis,s:n.share,p:n.pub,i:n.inherits});
const subOf=n=>{

  if(n.kind==='chapter') return plural(n.children.length,'page');
  if(n.kind==='page') return n.parent.name;
  return n.group?`Landing page · ${n.group}`:'Landing page';
};

  $('#toasts').appendChild(t);
  const kill=()=>t.remove(); t.querySelector('button').onclick=kill; setTimeout(kill,5000);
}
function closeMenu(){ if(MENU){MENU.remove();MENU=null;} }
function showMenu(anchor,items,opts={}){
  closeMenu();
  const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
  m.innerHTML=items.map((it,i)=>`<button role="menuitem" data-i="${i}" ${it.disabled?'disabled':''} ${it.tip&&it.disabled?`title="${esc(it.tip)}"`:''}>${it.icon?ic(it.icon,'s'):''}<span>${esc(it.label)}</span>${it.checked?`<span class="chk">${ic('check','s')}</span>`:''}</button>`).join('');
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect();
  m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-8)+'px';
  m.style.top=(r.bottom+4)+'px';
  if(opts.matchWidth) m.style.minWidth=r.width+'px';
  m.addEventListener('mousedown',e=>e.preventDefault());
  m.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b||b.disabled)return;const it=items[+b.dataset.i];closeMenu();it.onClick&&it.onClick();});
  MENU=m;
}

function chooseRows(n,lvl,acc){

}
function drawChoose(){
  const keep=$('#layer .mbody')?.scrollTop||0, acc=[]; M.guides.forEach(g=>chooseRows(g,0,acc));
  const v=M.pub?'Publish':'Unpublish', n=M.chk.size;
  layer(`<div class="big" role="dialog" aria-modal="true" aria-label="${v} pages"><div class="mhead"><div class="ttl">${v} pages in ${plural(M.guides.length,'guide')}</div><button class="btn icon" data-m="close" aria-label="Close">${ic('close')}</button></div>
   <div class="mbody"><div class="thead cols-choose"><span class="b">Content</span><span style="text-align:right">Status</span></div>${acc.join('')}</div>
   <div class="mfoot"><span class="sp"></span><button class="btn sec" data-m="close">Cancel</button><button class="btn pri" data-m="docp" ${n?'':'disabled'}>${v}</button></div></div>`);
  $('#layer .mbody').scrollTop=keep;
}

/* ---------- manage access ---------- */
function openManage(items){
  M={type:'manage',edit:false,roots:items,exp:new Set(),open:new Set(),err:{},orig:null,items};
  drawManage();
}
function cloneRoots(roots){ const c=structuredClone(roots); return c; }
function startEdit(){
  M.base=M.roots; M.roots=cloneRoots(M.base); M.orig={}; M.roots.forEach(r=>walk(r,x=>M.orig[x.id]=sig(x))); M.edit=true; M.err={}; M.clip=CLIP=null; drawManage();
}
function dirty(){ let d=false; M.roots.forEach(r=>walk(r,x=>{if(sig(x)!==M.orig[x.id])d=true;})); return d; }
function find(id){let f=null;M.roots.forEach(r=>walk(r,x=>{if(x.id===id)f=x;}));return f;}
function chips(n,row){
  const s=n.share, total=s.length, open=M.open.has(n.id);
  const chip=g=>`<span class="pill">${ic(ROLE_ICON[g.role]||'person')}${esc(g.name)}</span>`;
  if(open||total<=2) return s.map(chip).join('')+(open&&total>2?`<button class="pill round" data-m="less" data-id="${n.id}" aria-label="Show fewer">${ic('minus','s')}</button>`:'');
  const show=total>=5?2:1;
  return s.slice(0,show).map(chip).join('')+`<button class="pill more" data-m="more" data-id="${n.id}" aria-label="Show ${total-show} more">+${total-show}</button>`;
}
function manageRows(n,lvl,acc){
  const open=M.exp.has(n.id), has=n.children.length>0, chg=M.edit&&sig(n)!==M.orig[n.id];
  const [a,b]=pubCount(n);
  const inh=n.kind==='guide'&&n.inherits&&n.group?`<span class="inh" title="${esc(n.group)}">Inherited from ${esc(n.group)}</span>`:'';
  const isPage=n.kind==='page'||n.kind==='lp';
  const pubView=isPage?(n.pub?'<span class="pill ok">Published</span>':'<span class="pill off">Unpublished</span>'):`<span class="pcount">${a} of ${b} published</span>`;
  const main=`<div class="main-c" style="padding-left:${16+lvl*24}px"><button class="chev ${has?'':'none'}" data-m="mexp" data-id="${n.id}" aria-label="${open?'Collapse':'Expand'} ${esc(n.name)}" aria-expanded="${open}">${ic(open?'down':'right')}</button>
    <div class="mthumb">${ic(n.kind==='guide'?'guide':n.kind==='chapter'?'chapter':'lpage')}</div><div class="mt"><span class="nm">${esc(n.name)}</span><span class="sb">${esc(subOf(n))}</span>${inh}</div></div>`;
  if(!M.edit){
    acc.push(`<div class="tr cols-view" data-id="${n.id}">${main}<div><span class="pill">${ic(VIS_ICON[n.vis])}${n.vis}</span></div><div>${chips(n)}</div><div class="c-pub">${pubView}</div></div>`);
  } else {
    const parent=n.parent;
    const grantees=n.share.map(g=>`<div class="gr"><span class="pill">${esc(g.name)}${g.role!=='Owner'?`<button class="x" data-m="rm" data-id="${n.id}" data-n="${esc(g.name)}" aria-label="Remove ${esc(g.name)}">${ic('close','s')}</button>`:''}</span>
      <button class="btn sec sm rolebtn" data-m="role" data-menu data-id="${n.id}" data-n="${esc(g.name)}" ${g.role==='Owner'?'disabled':''}><span>${g.role}</span>${ic('caret','s')}</button></div>`).join('');
    const isSrc=CLIP&&CLIP.from===n.id;
    acc.push(`<div class="tr cols-edit ${chg?'chg':''}" data-id="${n.id}">${main}
      <div><button class="btn sec sm" data-m="vis" data-menu data-id="${n.id}">${ic(VIS_ICON[n.vis],'s')}<span class="lbl">${n.vis}</span>${ic('caret','s')}</button></div>
      <div><div class="shr"><div class="inp"><input data-m="add" data-id="${n.id}" placeholder="Add users, groups or profiles" aria-label="Add users, groups or profiles to ${esc(n.name)}" autocomplete="off"></div>${grantees}</div></div>
      <div class="c-pub">${isPage?`<button class="tgl ${n.pub?'on':''}" data-m="tgl" data-id="${n.id}" role="switch" aria-checked="${n.pub}" aria-label="Published: ${esc(n.name)}"></button>`:`<span class="pcount">${a} of ${b} published</span>`}</div>
      <div class="ra"><div class="rowact"><button class="${isSrc?'src':''}" data-m="copy" data-id="${n.id}" data-tip="${isSrc?'Copied':'Copy settings'}" aria-label="Copy settings from ${esc(n.name)}">${ic('copy','s')}</button><button data-m="paste" data-id="${n.id}" ${(!CLIP||isSrc)?'disabled':''} data-tip="Paste settings" aria-label="Paste settings onto ${esc(n.name)}">${ic('paste','s')}</button></div></div>
      ${M.err[n.id]?`<div class="err" role="alert">${ic('warn','s')}<span>${esc(M.err[n.id])}</span></div>`:''}</div>`);
  }
  if(open) n.children.forEach(c=>manageRows(c,lvl+1,acc));
}
function drawManage(){
  const keep=$('#layer .mbody')?.scrollTop||0, acc=[]; M.roots.forEach(r=>manageRows(r,0,acc));
  const e=M.edit;
  layer(`<div class="big" role="dialog" aria-modal="true" aria-label="Manage access"><div class="mhead"><div class="ttl">Manage access</div><button class="btn icon" data-m="x" aria-label="Close">${ic('close')}</button></div>
  <div class="mbody"><div class="thead ${e?'cols-edit':'cols-view'}"><span class="b">Content</span><span>Visibility</span><span>Sharing</span><span style="text-align:right">Publish</span>${e?'<span></span>':''}</div>${acc.join('')}</div>
  <div class="mfoot">${e?'':`<button class="btn sec" data-m="edit">${ic('pencil')}<span class="lbl">Edit</span></button>`}<span class="sp"></span>${e?`<button class="btn sec" data-m="cancel">Cancel</button><button class="btn pri" data-m="save">Save changes</button>`:`<button class="btn sec" data-m="close">Cancel</button>`}</div></div>`);
  $('#layer .mbody').scrollTop=keep;
}
function tryEdit(id,fn,msg){
  const n=find(id), before=structuredClone({vis:n.vis,share:n.share,pub:n.pub,inherits:n.inherits});
  fn(n); const err=validate(n);
  if(err){ Object.assign(n,before); M.err[id]=msg||err; setTimeout(()=>{ if(M&&M.err&&M.err[id]){delete M.err[id];drawManage();} },5000); }
  else { delete M.err[id]; if(n.kind==='guide'&&(n.vis!==before.vis||JSON.stringify(n.share)!==JSON.stringify(before.share))) n.inherits=false; }
  drawManage();
}
function addSuggest(input){
  const n=find(input.dataset.id), q=input.value.trim().toLowerCase();
  const have=new Set(n.share.map(g=>g.name));
  const pool=[...PEOPLE,...Object.keys(GROUP_MEMBERS)].filter(x=>!have.has(x)&&x.toLowerCase().includes(q));
  const parentPeople=n.parent?people(n.parent.share):null;
  const items=pool.map(name=>{ const mem=GROUP_MEMBERS[name]||[name]; const bad=parentPeople&&mem.some(x=>!parentPeople.has(x));
    return {label:name,icon:GROUP_MEMBERS[name]?'building':'person',disabled:!!bad,tip:`Not in the ${n.parent&&n.parent.kind==='guide'?'guide':'chapter'}`,onClick:()=>{tryEdit(n.id,x=>x.share.push(sh(name,'Viewer')));}}; });
  if(!items.length){closeMenu();return;} showMenu(input.closest('.inp'),items,{matchWidth:true});
}
document.addEventListener('input',e=>{ const i=e.target.closest('input[data-m=add]'); if(i) addSuggest(i); });
document.addEventListener('focusin',e=>{ const i=e.target.closest('input[data-m=add]'); if(i) addSuggest(i); });

function requestClose(){
  if(M&&M.type==='manage'&&M.edit&&dirty()){ confirmClose(); } else closeLayer();
}
function confirmClose(){
  const html=`<div class="scrim" style="z-index:200" id="scrim2"><div class="dlg" role="alertdialog" aria-modal="true" aria-label="Close without saving?"><div class="mhead"><div class="thumbi">${ic('warn')}</div><div class="ttl">Close without saving?</div><button class="btn icon" data-m="keep" aria-label="Close">${ic('close')}</button></div><div class="mbody"><p>Your changes won’t be saved.</p></div><div class="mfoot"><span class="sp"></span><button class="btn sec" data-m="keep">Keep editing</button><button class="btn pri" data-m="discard">Close</button></div></div></div>`;
  $('#layer').insertAdjacentHTML('beforeend',html);
}
function pasteTo(id){
  if(!CLIP) return;
  const c=CLIP;
  tryEdit(id,n=>{
    const own=n.share.filter(g=>g.role==='Owner');
    n.vis=c.vis; n.share=[...own,...c.share.filter(g=>g.role!=='Owner').map(g=>({...g}))];
    if((n.kind==='page'||n.kind==='lp')&&c.pub!==undefined) n.pub=c.pub;
    if(n.kind==='guide') n.inherits=false;
  },null);
  const n=find(id); if(M.err[id]) M.err[id]=M.err[id].replace("apply this","paste");
  drawManage();
}

/* ---------- layer events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('#layer [data-m]'); if(!b){ if(e.target.id==='scrim'&&M&&M.type!=='manage') closeLayer(); return; }
  const a=b.dataset.m, id=b.dataset.id;
  switch(a){
   case 'close': closeLayer(); break;
   case 'x': requestClose(); break;
   case 'keep': $('#scrim2').remove(); break;
   case 'discard': closeLayer(); break;
   case 'grp': showMenu(b,GROUP_NAMES.map(g=>({label:g,checked:M.group===g,onClick:()=>{M.group=g;M.draw();}})),{matchWidth:true}); break;
   case 'domove': { const g=M.group,n=M.items.length; M.items.forEach(i=>i.group=g); closeLayer(); renderApp(); toast(`${itemsWord(n)} moved to ${g}`); break; }
   case 'dotrash': { const n=M.items.length,ids=new Set(M.items.map(i=>i.id)); S.items=S.items.filter(i=>!ids.has(i.id)); S.sel.clear(); closeLayer(); renderApp(); toast(`${itemsWord(n)} moved to Trash`); break; }
   case 'dopub': { const n=M.items.length; M.items.forEach(i=>setPub(i,M.pub)); const v=M.pub?'published':'unpublished'; closeLayer(); renderApp(); toast(`${itemsWord(n)} ${v}`); break; }
   case 'cexp': { const rid=b.closest('.tr').dataset.id; M.exp.has(rid)?M.exp.delete(rid):M.exp.add(rid); drawChoose(); break; }
   case 'ccheck': {
     const rid=b.closest('.tr').dataset.id; let node=null; M.guides.forEach(g=>walk(g,x=>{if(x.id===rid)node=x;}));
     const ps=(node.kind==='page'?[node]:pagesOf(node)).filter(elig); if(!ps.length) break;
     const all=ps.every(p=>M.chk.has(p.id)); ps.forEach(p=>all?M.chk.delete(p.id):M.chk.add(p.id));
     // keep rows open so the selection is visible
     drawChoose(); break; }
   case 'docp': { const n=M.chk.size,pub=M.pub; M.guides.forEach(g=>walk(g,x=>{if(M.chk.has(x.id))x.pub=pub;})); closeLayer(); renderApp(); toast(`${plural(n,'page')} ${pub?'published':'unpublished'}`); break; }
   case 'mexp': M.exp.has(id)?M.exp.delete(id):M.exp.add(id); drawManage(); break;
   case 'more': M.open.add(id); drawManage(); break;
   case 'less': M.open.delete(id); drawManage(); break;
   case 'edit': startEdit(); break;
   case 'cancel': M.roots=M.base; M.edit=false; M.err={}; CLIP=null; drawManage(); break;
   case 'save': {
     const n=M.base.length; const map=new Map(M.roots.map(r=>[r.id,r])); S.items=S.items.map(i=>map.get(i.id)||i);
     S.items.forEach(i=>link(i,null)); closeLayer(); renderApp(); toast(`Access updated for ${itemsWord(n)}`); break; }
   case 'vis': { const n=find(id); showMenu(b,['Public','All users','Restricted'].map(v=>({label:v,icon:VIS_ICON[v],checked:n.vis===v,disabled:!!(n.parent&&RANK[v]>RANK[n.parent.vis]),tip:`Wider than the ${n.parent&&n.parent.kind==='guide'?'guide':'chapter'}`,onClick:()=>tryEdit(id,x=>x.vis=v)}))); break; }
   case 'role': { const name=b.dataset.n; showMenu(b,['Viewer','Editor'].map(r=>({label:r,checked:find(id).share.find(g=>g.name===name).role===r,onClick:()=>tryEdit(id,x=>x.share.find(g=>g.name===name).role=r)}))); break; }
   case 'rm': tryEdit(id,x=>x.share=x.share.filter(g=>g.name!==b.dataset.n)); break;
   case 'tgl': tryEdit(id,x=>x.pub=!x.pub); break;
   case 'copy': { const n=find(id); CLIP={from:id,vis:n.vis,share:structuredClone(n.share),pub:(n.kind==='page'||n.kind==='lp')?n.pub:undefined}; drawManage(); break; }
   case 'paste': pasteTo(id); break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(MENU){closeMenu();return;} if($('#scrim2')){$('#scrim2').remove();return;} if(M) requestClose(); }
});

renderApp();
const sp=new URLSearchParams(location.search);
if(sp.get('sel')){ S.items.slice(0,+sp.get('sel')).forEach(i=>S.sel.add(i.id)); renderApp(); }
</script>
